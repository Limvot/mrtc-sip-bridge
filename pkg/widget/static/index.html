<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Dialpad</title>
<link rel="stylesheet" href="static/app.css">
</head>
<body>
<main id="app">
  <p id="status" class="status" role="status" aria-live="polite">Connecting...</p>
  <p id="roomline" class="roomline" hidden></p>

  <section id="callbox" hidden>
    <button id="call-room" class="btn primary" type="button" hidden>Call</button>
    <p id="contact-line" class="roomline" hidden></p>
    <button id="save-toggle" class="btn link" type="button" hidden aria-expanded="false" aria-controls="savebox">Save contact</button>
    <div id="savebox" hidden>
      <label for="save-name">Name</label>
      <input id="save-name" type="text" maxlength="64" autocomplete="off" spellcheck="false">
      <button id="save-room" class="btn" type="button" disabled>Save</button>
    </div>
    <button id="other-toggle" class="btn link" type="button" hidden aria-expanded="false" aria-controls="dialbox">Dial another number</button>
  </section>

  <section id="dialbox" hidden>
    <label for="number">Number</label>
    <input id="number" type="tel" inputmode="tel" autocomplete="tel" maxlength="40" spellcheck="false" placeholder="+1 555 123 4567">
    <p id="preview" class="preview" aria-live="polite"></p>
    <div id="name-wrap" hidden>
      <label for="contact-name">Name (optional)</label>
      <input id="contact-name" type="text" maxlength="64" autocomplete="off" spellcheck="false" placeholder="Save this number as...">
    </div>
    <div class="row">
      <button id="call-number" class="btn primary" type="button" disabled>Call</button>
      <button id="message-number" class="btn" type="button" hidden disabled>Message</button>
    </div>
    <button id="save-number" class="btn link" type="button" hidden disabled>Save contact</button>
  </section>

  <p id="keys-shown" class="keys-shown" aria-live="off" hidden></p>
  <section id="keypad-wrap" hidden>
    <div id="keypad" class="keypad" role="group" aria-label="Keypad"></div>
    <button id="abcd-toggle" class="btn link" type="button" aria-expanded="false" aria-controls="keypad-extra">Show A-D</button>
    <div id="keypad-extra" class="keypad extra" role="group" aria-label="Extra keys A to D" hidden></div>
  </section>

  <p id="result" class="preview" role="status" aria-live="polite" hidden></p>
  <a id="open-chat" class="btn secondary" href="#" target="_blank" rel="noopener noreferrer" hidden>Open chat</a>
  <a id="open-room" class="btn secondary" href="#" target="_blank" rel="noopener noreferrer" hidden>Open room</a>
  <button id="hangup" class="btn danger" type="button" hidden>Hang up</button>

  <section id="settings" hidden>
    <label class="check"><input id="roster-only" type="checkbox"> <span>Only ring for contacts</span></label>
    <p id="roster-only-hint" class="hint">Calls from numbers not in your contacts go to voicemail.</p>
    <p id="roster-only-warn" class="status err" role="alert" hidden></p>
  </section>
</main>
<script src="static/app.js"></script>
</body>
</html>
